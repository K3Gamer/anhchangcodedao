name: Host Bot

on:
  workflow_dispatch: {}
  schedule:
    # Chay lai moi 6h vi GH Actions job bi gioi han toi da ~6h/lan.
    # Cron: 6h/1 lan -> bot online gan 100% (chi giat cuc moi 6h).
    - cron: "10 */6 * * *"

permissions:
  contents: write

concurrency:
  group: discord-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cai dependencies
        run: pip install -r requirements.txt

      - name: Pull du lieu xuyen restart (nhanh data)
        run: bash .github/scripts/pull_data.sh

      - name: Chay bot (push du lieu dinh ky moi 5 phut)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          bash -c 'while true; do sleep 300; bash .github/scripts/push_data.sh >/dev/null 2>&1; done' &
          bash .github/scripts/push_data.sh
          python bot.py
        shell: bash
        timeout-minutes: 348
